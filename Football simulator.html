function clDraw(teams,rnd){
  rnd=rnd||Math.random;const n=teams.length,pot=teams.map(t=>t.pot),assoc=teams.map(t=>t.assoc);
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  for(let attempt=0;attempt<120;attempt++){
    const faced=Array.from({length:n},()=>new Array(n).fill(false)),pc=Array.from({length:n},()=>[0,0,0,0]),ac=Array.from({length:n},()=>({}));
    const apply=(pairs,d)=>pairs.forEach(([a,b])=>{faced[a][b]=faced[b][a]=d>0;pc[a][pot[b]]+=d;pc[b][pot[a]]+=d;ac[a][assoc[b]]=(ac[a][assoc[b]]||0)+d;ac[b][assoc[a]]=(ac[b][assoc[a]]||0)+d});
    const can=(a,b)=>!faced[a][b]&&assoc[a]!==assoc[b]&&pc[a][pot[b]]<2&&pc[b][pot[a]]<2&&(ac[a][assoc[b]]||0)<2&&(ac[b][assoc[a]]||0)<2;
    const pairRound=()=>{const used=new Array(n).fill(false),pairs=[];let nodes=0;
      const rec=()=>{if(nodes++>2500)return false;let best=-1,bc=null;
        for(let a=0;a<n;a++){if(used[a])continue;const c=[];for(let b=0;b<n;b++)if(b!==a&&!used[b]&&can(a,b))c.push(b);if(!c.length)return false;if(!bc||c.length<bc.length){best=a;bc=c;if(c.length==1)break}}
        if(best<0)return true;shuffle(bc);
        for(const b of bc){used[best]=used[b]=true;pairs.push([best,b]);if(rec())return true;pairs.pop();used[best]=used[b]=false}return false};
      return rec()?pairs:null};
    // build matchday by matchday; if a matchday cannot be completed, retry it, and if it keeps failing step back one matchday
    const rounds=[],tries=new Array(9).fill(0);let r=0,steps=0;
    while(r<8&&steps++<400){const p=pairRound();
      if(p){apply(p,1);rounds[r]=p;r++;tries[r]=0}
      else if(++tries[r]>12){r--;if(r<0)break;apply(rounds[r],-1)}}
    if(r<8)continue;
    // home/away: walk closed trails through the 8-regular match graph, so every club gets exactly 4 home and 4 away
    const edges=[];rounds.forEach((p,ri)=>p.forEach(([a,b])=>edges.push({a,b,r:ri})));
    const adj=Array.from({length:n},()=>[]);edges.forEach((e,i)=>{adj[e.a].push(i);adj[e.b].push(i)});
    const usedE=new Array(edges.length).fill(false);
    for(let v=0;v<n;v++){while(adj[v].some(i=>!usedE[i])){let cur=v;for(;;){const i=adj[cur].find(i=>!usedE[i]);if(i===undefined)break;usedE[i]=true;const e=edges[i],o=e.a===cur?e.b:e.a;e.h=cur;e.w=o;cur=o}}}
    const out=Array.from({length:8},()=>[]);edges.forEach(e=>out[e.r].push({h:e.h,a:e.w}));
    return {rounds:out,attempts:attempt+1};
  }
  return null;
}



function fixPots(teams,limit){limit=limit||4;
  const notes=[];
  for(let guard=0;guard<60;guard++){
    let moved=false;
    for(let p=0;p<4&&!moved;p++){
      const inPot=teams.filter(t=>t.pot===p),cnt={};inPot.forEach(t=>cnt[t.assoc]=(cnt[t.assoc]||0)+1);
      for(const a in cnt){if(cnt[a]<=limit)continue;
        const mine=inPot.filter(t=>t.assoc===a),out=p<3?mine[mine.length-1]:mine[0],q=p<3?p+1:p-1;
        const cand=teams.filter(t=>t.pot===q&&t.assoc!==a);if(!cand.length)continue;
        const sw=p<3?cand[0]:cand[cand.length-1];
        out.pot=q;sw.pot=p;notes.push(out.name+' moved to pot '+(q+1)+', '+sw.name+' to pot '+(p+1)+' (too many '+a+' clubs in pot '+(p+1)+')');moved=true;break}
    }
    if(!moved)break;
  }
  return notes;
}

function clDrawSafe(teams,rnd){
  const notes=fixPots(teams,4);
  for(const lim of [4,3,2]){
    if(lim<4)notes.push(...fixPots(teams,lim));
    const res=clDraw(teams,rnd);if(res)return {res,notes};
  }
  return {res:null,notes};
}

[[[9,10],[23,24]],[[11,12],[21,22]],[[13,14],[19,20]],[[15,16],[17,18]]].forEach(([s,u],g)=>{const us=u.slice().sort(()=>R()-.5);ties.push({a:T(us[0]),b:T(s[0]),g},{a:T(us[1]),b:T(s[1]),g})});
c.kos=[{name:'Knockout play-offs',two:1,ties}];c.kr=0;c.leg=1}
// extra time (a third of the normal rate), then penalties
function clBreak(t,neutral){const h=neutral?t.a:t.b,o=h==t.a?t.b:t.a,[lh,lo]=clLams(h,o,neutral),eh=pois(lh/3),eo=pois(lo/3);t.et=h==t.a?[eh,eo]:[eo,eh];
const ta=t.l1[0]+(t.l2?t.l2[0]:0)+t.et[0],tb=t.l1[1]+(t.l2?t.l2[1]:0)+t.et[1];
if(ta!=tb){t.w=ta>tb?t.a:t.b;return}
const pa=cl(.5+(clStr(t.a)-clStr(t.b))*23/3000,.3,.7),aw=R()<pa,k=4+Math.floor(R()*2),l=k-1-(R()<.3?1:0);t.pen=aw?[k,l]:[l,k];t.w=aw?t.a:t.b}
function clPlayKO(){const c=S.cl,K=c.kos[c.kr];
K.ties.forEach(t=>{if(!K.two){const[x,y]=clPair(t.a,t.b,true);t.l1=[x,y];if(x==y)clBreak(t,true);else t.w=x>y?t.a:t.b}
else if(c.leg==1){const[x,y]=clPair(t.a,t.b,false);t.l1=[x,y]}
else{const[bh,aa]=clPair(t.b,t.a,false);t.l2=[aa,bh];const A=t.l1[0]+t.l2[0],B=t.l1[1]+t.l2[1];if(A!=B)t.w=A>B?t.a:t.b;else clBreak(t,false)}});
if(K.two&&c.leg==1){c.leg=2}else if(K.name=='Final'){clFinish()}else clNextRound();
save();tab='k';cgv=null;render();window.scrollTo(0,0)}
function clNextRound(){const c=S.cl,K=c.kos[c.kr],W=K.ties.map(t=>t.w),pos=n=>c.rank.indexOf(n)+1;let nr;
if(K.name=='Knockout play-offs'){const byG=[[],[],[],[]];K.ties.forEach(t=>byG[t.g].push(t.w));const sg={1:3,2:3,3:2,4:2,5:1,6:1,7:0,8:0},opp={};
[0,1,2,3].forEach(g=>{const ws=byG[g].slice().sort(()=>R()-.5);[1,2,3,4,5,6,7,8].filter(s=>sg[s]==g).forEach((s,i)=>opp[s]=ws[i])});
nr={name:'Round of 16',two:1,ties:[1,8,4,5,2,7,3,6].map(s=>({a:opp[s],b:c.rank[s-1]}))}}
else{const nm={'Round of 16':'Quarter-finals','Quarter-finals':'Semi-finals','Semi-finals':'Final'}[K.name],ties=[];
for(let i=0;i<W.length;i+=2){const x=W[i],y=W[i+1],hi=pos(x)<pos(y)?x:y,lo=hi==x?y:x;ties.push({a:lo,b:hi})}nr={name:nm,two:nm=='Final'?0:1,ties}}
c.kos.push(nr);c.kr++;c.leg=1}
function clFinish(){const c=S.cl,f=c.kos[c.kr].ties[0];c.stage='done';c.champ=f.w;c.runner=f.w==f.a?f.b:f.a;S.clh.push({s:c.season,w:c.champ,r:c.runner});
CLB.forEach(x=>x.dev=(x.dev||0)*.85+(R()+R()+R()-1.5)*3);S.cdev=Object.fromEntries(CLB.map(x=>[x.name,+(x.dev||0).toFixed(2)]));
celebrate({title:'UEFA Champions League '+clSeason(c.season),w:c.champ,r:c.runner,t:''})}
function clNew(){const c=S.cl;S.cl={season:c.season+1,stage:'setup',picks:c.picks.slice()};save();tab='c';cgv=null;render();window.scrollTo(0,0)}
function clNext(){clInit();const c=S.cl;if(c.stage=='setup')return c.picks.length==36?clStart():toast('Pick 36 clubs first ('+c.picks.length+' of 36).');

const KS={'Knockout play-offs':'Play-offs','Round of 16':'Last 16','Quarter-finals':'Quarters','Semi-finals':'Semis','Final':'Final'};
function clLabel(){const c=S.cl;if(!c||c.stage=='setup')return c&&c.picks.length==36?'Next ▸ Draw the league phase':'Next ▸ Pick your clubs';
if(c.stage=='md')return 'Next ▸ Matchday '+(c.md+1);if(c.stage=='ko'){const K=c.kos[c.kr];return 'Next ▸ '+KS[K.name]+(K.two?(c.leg==1?', 1st legs':', 2nd legs'):'')}return 'Next ▸ New season'}
const CTABS=()=>[['home','Home'],['c','Champions League'],['t','League table'],['k','Knockouts'],['h','History']];
function clGo(i){cgv=i;render();window.scrollTo(0,0)}
function clSetupHtml(){const c=S.cl,n=c.picks.length;

+CLA.filter(a=>CLB.some(x=>x.assoc==a.name)).map((a,ai)=>{const cs=CLB.map((x,i)=>[x,i]).filter(([x])=>x.assoc==a.name),k=clCount(a.name),op=clOpen[a.name]===undefined?ai<5:clOpen[a.name];
return `<details class="card p-3 mb-2" ${op?'open':''} ontoggle="clOpen['${a.name}']=this.open"><summary class="font-bold">${a.name} <span class="text-sm" style="color:${k>=a.slots?'var(--g)':'var(--mut)'}">${k} of ${a.slots}</span></summary><div class="mt-2">${cs.map(([x,i])=>{const on=c.picks.includes(i),dis=!on&&(k>=a.slots||n>=36);return `<button class="chip ${on?'on':''}" ${dis?'disabled':''} onclick="clTog(${i})">${isFav(x.name)?'★ ':''}${x.name}</button>`}).join('')}</div></details>`}).join('')}
const cline=(h,a,hg,ag)=>`<div class="mline grid grid-cols-[1fr_auto_1fr] gap-2 py-0.5 text-sm"><span class="${hg>ag?'font-bold':''}">${nm(h)}</span><span style="color:var(--y)">${hg}–${ag}</span><span class="text-right ${ag>hg?'font-bold':''}">${nm(a)}</span></div>`;
function clview(){const c=S.cl,i=cgv,t=c.teams[i],tb=clTable(),pos=tb.findIndex(x=>x.i==i)+1,r=tb[pos-1],ms=[];

const rows=ms.map(([ri,m])=>{const h=m.h==i,o=c.teams[h?m.a:m.h].name;if(m.hg===null)return `<div class="flex items-center gap-2 py-2" style="border-bottom:1px solid var(--hair)"><span class="wdl">–</span><span class="flex-1">${t.name} v ${o}</span><span class="text-xs text-slate-400">Matchday ${ri+1}, ${h?'home':'away'}</span></div>`;
const gf=h?m.hg:m.ag,ga=h?m.ag:m.hg,w=gf>ga?'W':gf<ga?'L':'D';return `<div class="flex items-center gap-2 py-2" style="border-bottom:1px solid var(--hair)"><span class="wdl ${w}">${w}</span><span class="flex-1">${nm(t.name)} <b style="color:var(--y)">${gf}–${ga}</b> ${nm(o)}</span><span class="text-xs text-slate-400">Matchday ${ri+1}, ${h?'home':'away'}</span></div>`}).join('');
return `<button class="btn2 mb-3" onclick="cgv=null;render()">‹ Back to the table</button><div class="card p-4 mb-3"><div class="flex items-start justify-between gap-2"><div class="text-2xl font-extrabold" style="color:var(--y)">${t.name}</div>${starBtn(t.name,'c')}</div><div class="text-sm text-slate-400">${t.assoc}, Pot ${t.pot+1}</div><div class="mt-2 text-sm">${r.p?`Position ${pos} with ${r.pts} point${r.pts==1?'':'s'}: ${r.w} won, ${r.d} drawn, ${r.l} lost, goals ${r.gf}–${r.ga}.`:'No matches played yet.'}</div></div><div class="card p-3"><b>${t.name}'s league phase</b>${rows}</div>`}
const tieHtml=(t,K)=>{const sw=n=>n==t.w?'font-weight:700':'',x=t.et?` (aet ${t.et[0]}–${t.et[1]})`:'',p=t.pen?` (${t.pen[0]}–${t.pen[1]} on penalties)`:'';let det,agg='';
if(!K.two)det=t.l1?`${t.a} ${t.l1[0]}–${t.l1[1]} ${t.b}${x}${p}`:'Not played yet';
else{det=(t.l1?`1st leg: ${t.a} ${t.l1[0]}–${t.l1[1]} ${t.b}`:'1st leg: not played yet')+'<br>'+(t.l2?`2nd leg: ${t.b} ${t.l2[1]}–${t.l2[0]} ${t.a}${x}${p}`:'2nd leg: not played yet');if(t.l2)agg=`Aggregate ${t.l1[0]+t.l2[0]+(t.et?t.et[0]:0)}–${t.l1[1]+t.l2[1]+(t.et?t.et[1]:0)}`}
return `<div class="tie py-2" style="border-bottom:1px solid var(--hair)"><div><span style="${sw(t.a)}">${nm(t.a)}</span> v <span style="${sw(t.b)}">${nm(t.b)}</span> <span class="text-xs text-slate-400">${agg}</span></div><div class="text-xs text-slate-400">${det}</div></div>`};
const CV={
c(){clInit();const c=S.cl;if(c.stage=='setup')return `<div id="clsetup">${clSetupHtml()}</div>`;
const st=c.stage=='md'?`League phase: ${c.md} of 8 matchdays played.`:c.stage=='ko'?`Knockout stage: ${c.kos[c.kr].name}${c.kos[c.kr].two?', '+(c.leg==1?'1st legs':'2nd legs')+' next':' next'}.`:`Season complete.`;
const pots=[0,1,2,3].map(p=>`<div class="mb-2"><b style="color:var(--y)">Pot ${p+1}</b><div class="text-sm">${c.teams.filter(t=>t.pot==p).map(t=>nm(t.name)).join(', ')}</div></div>`).join('');
return `<div class="card p-4 mb-3"><div class="text-sm text-slate-400">UEFA Champions League</div><div class="shine">${clSeason(c.season)}</div><div class="text-sm mt-1">${st}</div>${c.champ?`<div class="mt-2">🏆 <b style="color:var(--y)">${c.champ}</b> won it, beating ${c.runner} in the final.</div>`:''}</div>`
+(c.stage=='md'&&c.md>0?`<div class="card p-3 mb-3"><b>Matchday ${c.md} results</b>${c.fx[c.md-1].map(m=>cline(c.teams[m.h].name,c.teams[m.a].name,m.hg,m.ag)).join('')}</div>`:'')
+(c.stage!='md'?`<div class="card p-3 mb-3 text-sm">The league phase is finished. See <b>League table</b> and <b>Knockouts</b> in the menu.</div>`:'')
+sec('The draw: four pots by coefficient',pots+(c.notes&&c.notes.length?`<div class="text-xs text-slate-400 mt-2">Adjusted so a fair draw was possible: ${c.notes.join('; ')}.</div>`:''))},
t(){const c=S.cl;if(!c||!c.teams)return '<div class="card p-4">Draw the league phase first.</div>';if(cgv!=null)return clview();
const tb=clTable();return `<div class="card p-3"><div class="sc"><table class="w-full tight"><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>${tb.map((r,i)=>`<tr class="cursor-pointer" onclick="clGo(${r.i})" style="color:${i<8?'var(--g)':i<16?'var(--y)':i<24?'var(--ink)':'var(--mut)'}"><td>${i+1}</td><td style="white-space:normal">${nm(r.name)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf-r.ga}</td><td><b>${r.pts}</b></td></tr>`).join('')}</table></div><div class="text-xs text-slate-400 mt-3">Green: top 8 go straight to the round of 16. Gold: seeded for the play-offs. 17th to 24th: unseeded play-offs. The rest are out. Tap a club to see its matches.</div></div>`},
k(){const c=S.cl;if(!c||!c.kos)return '<div class="card p-4">The knockout rounds begin after matchday 8: the top 8 go straight to the round of 16 and places 9 to 24 play off.</div>';
return c.kos.map(K=>`<div class="card p-3 mb-3"><b style="color:var(--y)">${K.name}</b>${K.ties.map(t=>tieHtml(t,K)).join('')}</div>`).join('')},
h(){clInit();const h=S.clh,m={};h.forEach(x=>{m[x.w]=(m[x.w]||0)+1});const top=Object.entries(m).sort((a,b)=>b[1]-a[1]);

// ---------- favourites: star a team on its screen, and it is highlighted wherever it appears (both modes) ----------
const isFav=n=>!!(S.fav&&S.fav[n]),nm=n=>isFav(n)?`<span class="fav">★ ${n}</span>`:n;
const starBtn=(n,k)=>{const i=k=='c'?CLB.indexOf(CLM[n]):T.indexOf(M[n]),on=isFav(n);return `<button class="starbtn ${on?'on':''}" aria-pressed="${on}" aria-label="${on?'Remove from favourites':'Add to favourites'}" onclick="togFavI('${k}',${i})">${on?'★':'☆'}</button>`};
