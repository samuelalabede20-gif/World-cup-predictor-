[...L.groups.flatMap(x=>x.ms),...L.rounds.flatMap(r=>r.ms)].forEach(m=>{const a=g(m.a).h,b=g(m.b).h;a[m.b]=a[m.b]||[0,0,0];b[m.a]=b[m.a]||[0,0,0];
if(m.w==m.a){a[m.b][0]++;b[m.a][2]++}else if(m.w==m.b){a[m.b][2]++;b[m.a][0]++}else{a[m.b][1]++;b[m.a][1]++}})}

const rv=Object.entries(p.h).sort((a,b)=>b[1].reduce((x,y)=>x+y)-a[1].reduce((x,y)=>x+y)||b[1][0]-a[1][0]).slice(0,5);
return `<button class="btn2 mb-3" onclick="pt=null;render()">‹ Back to teams</button><div class="card p-4 mb-3"><div class="text-2xl font-extrabold" style="color:var(--y)">${n}</div><div class="text-sm text-slate-400">${t.confed} · rank #${pos} · Elo ${Math.round(t.elo)} · ATT ${t.attack} · DEF ${t.defense}</div><div class="mt-2 text-sm">🏆 ${ti} World Cup title${ti==1?'':'s'} all-time · simulated: ${p.q.length} appearance${p.q.length==1?'':'s'}, best finish: ${best}</div></div>
<div class="card p-3 mb-3"><b>Ranking timeline</b> <span class="text-xs text-slate-400">(${ga?'all':'last 5'} World Cups)</span>${p.e.length>5?` <button class="text-xs underline" style="color:var(--g)" onclick="ga=!ga;render()">${ga?'Show last 5':'Show all'}</button>`:''}${ch||'<div class="text-sm text-slate-400">Simulate a World Cup to start the timeline.</div>'}</div>
